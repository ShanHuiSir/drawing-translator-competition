[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drawing-translator"
version = "1.0.0"
description = "Local engineering drawing OCR, Chinese translation and annotation"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.24,<2", "Pillow>=10,<13", "numpy>=1.26,<3",
  "rapidocr-onnxruntime==1.4.4", "onnxruntime>=1.18,<2", "opencv-python==4.11.0.86",
  "ctranslate2>=4.5,<5", "sentencepiece>=0.2,<0.3",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "pyinstaller>=6"]

[project.scripts]
drawing-translator = "drawing_translator.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drawing_translator = ["web/*", "data/*", "data/demo/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
